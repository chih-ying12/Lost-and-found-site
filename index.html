<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🔍 Lost & Found – Secure Claims</title>
  <style>
    /* … (all existing CSS remains unchanged) … */
  </style>
  <script src="https://unpkg.com/parse@5.3.0/dist/parse.min.js"></script>
</head>
<body>
<div class="app-container" id="appContainer">
  <!-- ========== LOGIN PAGE ========== -->
  <!-- … (unchanged) … -->
  
  <!-- ========== LOST PAGE ========== -->
  <div id="lostPage" class="page hidden has-back-arrow">
    <button class="back-arrow-circle" id="backToHomeFromLost">←</button>
    <h2>🔍 I lost an item</h2>
    <p style="color:#475569;">Describe your lost item – we’ll show matching found items.</p>
    <div class="card">
      <select id="lostType"><option value="">Select type</option></select>
      <select id="lostSubcategory" class="hidden"><option value="">Select sub‑category</option></select>
      <input type="text" id="lostSubcategoryOther" placeholder="Custom sub‑category" class="hidden custom-input">
      <!-- Model/Brand dropdown will be dynamically renamed -->
      <select id="lostModel"><option value="">Select Brand / Model</option></select>
      <input type="text" id="lostModelCustom" placeholder="Custom brand/model" class="hidden custom-input">
      <select id="lostColor"><option value="">Select Color</option></select>
      <input type="text" id="lostColorCustom" placeholder="Custom color" class="hidden custom-input">
      <input type="text" id="lostAppearance" placeholder="Appearance (scratches, stickers…)">
      <textarea id="lostDescription" rows="2" placeholder="Additional description"></textarea>
      <div class="location-label">📍 Where was it found?</div>
      <select id="lostRoom"><option value="">Select Location</option></select>
      <input type="text" id="lostRoomCustom" placeholder="Custom location" class="hidden custom-input">
      <input type="text" id="lostFloor" placeholder="Floor / Level (optional)">
      <button id="searchMatchingBtn" class="primary-btn">🔎 Find matches</button>
    </div>
    <div id="lostResults"></div>
  </div>

  <!-- ========== FOUND PAGE ========== -->
  <div id="foundPage" class="page hidden has-back-arrow">
    <button class="back-arrow-circle" id="backToHomeFromFound">←</button>
    <h2>📦 Report Found Item</h2>
    <div class="card">
      <select id="foundType"><option value="electronic">📱 Electronic</option></select>
      <select id="foundSubcategory" class="hidden"><option value="">Select sub‑category</option></select>
      <input type="text" id="foundSubcategoryOther" placeholder="Custom sub‑category" class="hidden custom-input">
      <select id="foundModel"><option value="">Select Brand / Model</option></select>
      <input type="text" id="foundModelCustom" placeholder="Custom brand/model" class="hidden custom-input">
      <select id="foundColor"><option value="">Select Color</option></select>
      <input type="text" id="foundColorCustom" placeholder="Custom color" class="hidden custom-input">
      <input type="text" id="foundAppearance" placeholder="Appearance">
      <textarea id="foundDescription" rows="2" placeholder="Additional description"></textarea>
      <div class="location-label">📍 Where was it found?</div>
      <select id="foundRoom"><option value="">Select Location</option></select>
      <input type="text" id="foundRoomCustom" placeholder="Custom location" class="hidden custom-input">
      <input type="text" id="foundFloor" placeholder="Floor / Level (optional)">
      <input type="datetime-local" id="foundTime" required>
      <input type="text" id="foundContactInfo" placeholder="Your contact (phone/email)">
      <input type="file" id="foundPhoto" accept="image/*">
      <button id="submitFoundBtn" class="primary-btn">✅ Submit found item</button>
    </div>
  </div>

  <!-- ========== MODALS & ADMIN ========== -->
  <!-- … (all existing popups, admin panel unchanged) … -->
</div>

<script>
  // ============================================================
  // PARSE INITIALISATION (unchanged)
  // ============================================================
  Parse.initialize("qknjxJVl86XMkFayCADjD7S61rW8VajE0QVg9XDm", "uAZAVjQWw3VHdnqPGKdV3JEh8uivvEN8leNJi3bp");
  Parse.serverURL = "https://parseapi.back4app.com/";
  const LostItem = Parse.Object.extend("LostItem");
  const HOST_PASSWORD = "host123";

  // … (all other code – subcategory maps, type options, etc. – remains exactly the same) …

  // ========== BRAND OPTIONS PER TYPE (unchanged) ==========
  const brandOptionsByType = {
    electronic: ['Lenovo', 'Dell', 'HP', 'Apple', 'Samsung', 'Sony', 'Asus', 'Acer', 'Other'],
    personal: ['Rolex', 'Casio', 'Fossil', 'Ray-Ban', 'Oakley', 'Other'],
    clothing: ['Nike', 'Adidas', 'Uniqlo', 'H&M', 'Zara', "Levi's", 'Other'],
    documents: ['Other'],
    keys: ['Other'],
    bags: ['Herschel', 'Samsonite', 'Jansport', 'Other'],
    other: ['Other']
  };

  // ========== POPULATE HELPERS (slightly enhanced) ==========
  function populateSelect(selectId, options, labelMap, firstOptionText) {
    const sel = document.getElementById(selectId);
    sel.innerHTML = '';
    const firstOpt = document.createElement('option');
    firstOpt.value = '';
    firstOpt.textContent = firstOptionText || 'Select…';
    sel.appendChild(firstOpt);
    const sorted = [...options].sort((a,b) => a.localeCompare(b));
    const otherIdx = sorted.indexOf('Other');
    if (otherIdx > -1) { sorted.splice(otherIdx, 1); sorted.push('Other'); }
    sorted.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt;
      const label = labelMap ? labelMap[opt] : opt;
      option.textContent = label || opt;
      sel.appendChild(option);
    });
  }

  // The only changed function: now sets proper label/placeholder for model vs brand
  function populateModelSelect(selectId, type) {
    const isElectronic = type === 'electronic';
    const firstText = isElectronic ? 'Select Model' : 'Select Brand';
    const brands = brandOptionsByType[type] || ['Other'];
    populateSelect(selectId, brands, null, firstText);

    // Update custom input placeholder accordingly
    const customId = selectId.replace('Model', 'ModelCustom');
    const customInput = document.getElementById(customId);
    if (customInput) {
      customInput.placeholder = isElectronic ? 'Custom model' : 'Custom brand';
    }
  }

  // Rest of the code (initialization, events, auth, admin, etc.) – completely unchanged
  // …
  // Ensure the found page is initialised correctly on load
  window.addEventListener('DOMContentLoaded', function() {
    // Found page starts with electronic, so we set model label + options
    handleTypeChange('found');
    updateSubcategory('foundType', 'foundSubcategory', 'foundSubcategoryOther');
  });

  checkSession();
</script>
</body>
</html>
