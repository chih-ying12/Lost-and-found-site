<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🔍 Lost & Found</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/parse@5.3.0/dist/parse.min.js"></script>
  <style>
    /* Make the white card the positioning anchor */
    .app-container {
      position: relative;
    }
    /* Pages that have a back arrow get extra top padding so the title isn't covered */
    .page.has-back-arrow {
      padding-top: 50px; /* space for the arrow */
    }
    /* The back arrow inside the white card */
    .back-arrow-top {
      position: absolute;
      top: 16px;
      left: 16px;
      background: transparent;
      border: none;
      font-size: 24px;
      color: #1e293b;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
      line-height: 1;
      z-index: 10;
    }
    .back-arrow-top:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">
  <!-- LOGIN PAGE (no back arrow, no extra padding) -->
  <div id="loginPage" class="page">
    <h2><span class="emoji-icon">🔐</span> Welcome</h2>
    <div id="loginForm">
      <input type="text" id="loginUsername" placeholder="👤 Username">
      <input type="password" id="loginPassword" placeholder="🔑 Password">
      <button id="signInBtn">🚪 Sign In</button>
      <button id="showSignUpBtn" style="background:#eef2f6; color:#1e293b;">✨ Create account</button>
    </div>
    <div id="signUpForm" class="hidden">
      <input type="text" id="signUpUsername" placeholder="👤 Choose username">
      <input type="password" id="signUpPassword" placeholder="🔑 Create password">
      <button id="signUpSubmitBtn">📝 Sign Up</button>
      <button id="showLoginBtn" style="background:#eef2f6; color:#1e293b;">⬅ Back to login</button>
    </div>
    <p id="authMessage" style="color:#b91c1c; text-align:center;"></p>
  </div>

  <!-- ROLE SELECTION -->
  <div id="roleSelectionPage" class="page hidden has-back-arrow">
    <button class="back-arrow-top" id="backToLoginFromRole">←</button>
    <h2 style="justify-content:center;">👋 Choose Role</h2>
    <p style="text-align:center;">Logged in as <strong id="roleUsername"></strong></p>
    <button id="goUserBtn"><span class="emoji-icon">👤</span> Continue as User</button>
    <button id="goHostAccessBtn"><span class="emoji-icon">🛠️</span> Enter Host Panel</button>
    <button id="logoutFromRoleBtn" style="background:#b91c1c;"><span class="emoji-icon">🚪</span> Log out</button>
  </div>

  <!-- HOST PASSWORD PAGE -->
  <div id="hostPasswordPage" class="page hidden has-back-arrow">
    <button class="back-arrow-top" id="backToRoleFromHost">←</button>
    <h2><span class="emoji-icon">🔐</span> Host Password</h2>
    <input type="password" id="hostPasswordInput" placeholder="Enter host password">
    <button id="submitHostPasswordBtn">🔓 Unlock Panel</button>
    <p id="hostPasswordMessage" style="color:#b91c1c; text-align:center;"></p>
  </div>

  <!-- USER HOME -->
  <div id="homePage" class="page hidden has-back-arrow">
    <button class="back-arrow-top" id="backToRoleFromHome">←</button>
    <h2><span class="emoji-icon">🏠</span> Home</h2>
    <p>Welcome, <span id="displayUsername">...</span>!</p>
    <button id="goLostBtn"><span class="emoji-icon">🔎</span> Lost something?</button>
    <button id="goFoundBtn"><span class="emoji-icon">📦</span> I found an item</button>
    <button id="openCheckCodeBtn"><span class="emoji-icon">🔑</span> Check Claim Code</button>
    <button id="logoutFromHomeBtn" style="background:#b91c1c;"><span class="emoji-icon">🚪</span> Log out</button>
  </div>

  <!-- LOST PAGE -->
  <div id="lostPage" class="page hidden has-back-arrow">
    <button class="back-arrow-top" id="backToHomeFromLost">←</button>
    <h2><span class="emoji-icon">🔎</span> Lost Items</h2>
    <div class="row">
      <input type="text" id="lostSearchInput" placeholder="🔍 search items..." style="flex:2;">
      <button id="searchLostBtn" style="flex:1;">Filter</button>
    </div>
    <div id="lostResults" style="display:flex; flex-direction:column; gap:12px;"></div>
  </div>

  <!-- FOUND PAGE -->
  <div id="foundPage" class="page hidden has-back-arrow">
    <button class="back-arrow-top" id="backToHomeFromFound">←</button>
    <h2><span class="emoji-icon">📦</span> Report Found Item</h2>
    <select id="foundType">
      <option value="electronic">📱 Electronic</option>
      <option value="personal">🎒 Personal Belongings</option>
      <option value="clothing">👕 Clothing / Accessories</option>
      <option value="documents">🪪 Documents / IDs</option>
      <option value="keys">🔑 Keys</option>
      <option value="bags">👜 Bags / Luggage</option>
      <option value="other">📌 Other</option>
    </select>
    <input type="text" id="foundColor" placeholder="🎨 Color">
    <input type="text" id="foundModel" placeholder="🏷️ Model / Brand">
    <input type="text" id="foundAppearance" placeholder="✨ Appearance (scratches, stickers...)">
    <textarea id="foundDescription" placeholder="📝 Additional description (optional)" rows="2"></textarea>
    <input type="datetime-local" id="foundTime">
    <input type="text" id="foundLocation" placeholder="📍 Location found">
    <div><label>🔐 Verification (hidden)</label></div>
    <input type="text" id="foundVeriQuestion" placeholder="Question (e.g., wallpaper)">
    <input type="text" id="foundVeriAnswer" placeholder="Answer (secret)">
    <input type="text" id="foundContactInfo" placeholder="📞 Your contact (optional)">
    <div class="row"><label>📸 Photo</label><input type="file" id="foundPhoto" accept="image/*"></div>
    <button id="submitFoundBtn">✅ Submit item</button>
    <!-- No bottom success message; success is a popup -->
  </div>

  <!-- VERIFY POPUP -->
  <div id="verifyPopup" class="verify-popup hidden">
    <div class="popup-content">
      <h3>🔐 Verification</h3>
      <p id="verifyQuestionText"></p>
      <p id="verifyStatusMessage" style="color:#b91c1c; font-weight:500;"></p>
      <input type="text" id="verifyAnswerInput" placeholder="Your answer">
      <button id="submitVerifyBtn">✅ Confirm</button>
      <button id="cancelVerifyBtn" style="background:#aaa;">Cancel</button>
      <p id="verifyMessage" style="font-weight:600;"></p>
      <div id="claimCodeSection" style="display:none; text-align:center; margin-top:10px;">
        <p style="font-weight:700; background:#e6f7ec; padding:12px; border-radius:14px;">
          🎫 Claim Code: <span id="claimCodeText" style="font-size:1.6rem; letter-spacing:2px;"></span>
        </p>
        <button id="copyClaimCodeBtn" class="copy-btn">📋 Copy Code</button>
        <button id="closeClaimCodeBtn" style="margin-top:8px;">Close</button>
      </div>
    </div>
  </div>

  <!-- CHECK CLAIM CODE POPUP -->
  <div id="checkCodePopup" class="verify-popup hidden">
    <div class="popup-content">
      <h3>🔑 Check Claim Code</h3>
      <p>Enter the code from the owner.</p>
      <input type="text" id="checkCodeInput" placeholder="e.g. A3K9X7">
      <button id="submitCheckCodeBtn">✅ Check</button>
      <button id="cancelCheckCodeBtn" style="background:#aaa;">Cancel</button>
      <div id="checkCodeResult" style="margin-top:8px; font-size:0.9rem;"></div>
    </div>
  </div>

  <!-- SUCCESS POPUP (posting) -->
  <div id="successPopup" class="verify-popup hidden">
    <div class="popup-content" style="text-align:center;">
      <h3 style="font-size:2rem;">✅</h3>
      <p style="font-size:1.2rem;">Item posted!</p>
      <button id="closeSuccessPopup" style="margin:0 auto;">OK</button>
    </div>
  </div>

  <!-- HOST CONTROL PANEL -->
  <div id="adminPage" class="page hidden has-back-arrow">
    <button class="back-arrow-top" id="backToRoleFromAdmin">←</button>
    <h2><span class="emoji-icon">🛠️</span> Host Control Panel</h2>
    <p style="color:#7d6608;">All items (incl. resolved & blocked)</p>
    <div id="adminResults" style="display:flex; flex-direction:column; gap:12px;"></div>
  </div>
</div>

<script src="backend.js"></script>
<script src="login.js"></script>
<script>
  const HOST_PASSWORD = "host123";
  let currentVerifyingItemId = null;

  function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    page.classList.remove('hidden');
  }

  function checkSession() {
    const user = auth.getCurrentUser();
    if (user) {
      document.getElementById('roleUsername').textContent = user.getUsername();
      showPage(document.getElementById('roleSelectionPage'));
    } else {
      showPage(document.getElementById('loginPage'));
    }
  }

  // ------- LOGIN / SIGNUP -------
  document.getElementById('showSignUpBtn').addEventListener('click', () => {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('signUpForm').classList.remove('hidden');
  });
  document.getElementById('showLoginBtn').addEventListener('click', () => {
    document.getElementById('signUpForm').classList.add('hidden');
    document.getElementById('loginForm').classList.remove('hidden');
  });

  document.getElementById('signInBtn').addEventListener('click', async () => {
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    if(!u||!p) return document.getElementById('authMessage').textContent='Fill both fields.';
    try { await auth.logIn(u,p); checkSession(); }
    catch(e) { document.getElementById('authMessage').textContent = e.message; }
  });
  document.getElementById('signUpSubmitBtn').addEventListener('click', async () => {
    const u = document.getElementById('signUpUsername').value.trim();
    const p = document.getElementById('signUpPassword').value;
    if(!u||!p) return document.getElementById('authMessage').textContent='Fill both fields.';
    try { await auth.signUp(u,p); checkSession(); }
    catch(e) { document.getElementById('authMessage').textContent = e.message; }
  });

  // ------- ROLE SELECTION -------
  document.getElementById('goUserBtn').addEventListener('click', () => {
    document.getElementById('displayUsername').textContent = auth.getCurrentUser().getUsername();
    showPage(document.getElementById('homePage'));
  });
  document.getElementById('goHostAccessBtn').addEventListener('click', () => {
    document.getElementById('hostPasswordInput').value = '';
    document.getElementById('hostPasswordMessage').textContent = '';
    showPage(document.getElementById('hostPasswordPage'));
  });
  document.getElementById('logoutFromRoleBtn').addEventListener('click', async () => { await auth.logOut(); showPage(loginPage); });

  // Back arrow handlers
  document.getElementById('backToLoginFromRole').addEventListener('click', async () => { await auth.logOut(); showPage(loginPage); });
  document.getElementById('backToRoleFromHost').addEventListener('click', () => showPage(roleSelectionPage));
  document.getElementById('backToRoleFromHome').addEventListener('click', () => showPage(roleSelectionPage));
  document.getElementById('backToHomeFromLost').addEventListener('click', () => showPage(homePage));
  document.getElementById('backToHomeFromFound').addEventListener('click', () => showPage(homePage));
  document.getElementById('backToRoleFromAdmin').addEventListener('click', () => showPage(roleSelectionPage));

  // Host password
  document.getElementById('submitHostPasswordBtn').addEventListener('click', () => {
    if (document.getElementById('hostPasswordInput').value.trim() === HOST_PASSWORD) {
      showPage(document.getElementById('adminPage'));
      loadAdminItems();
    } else {
      document.getElementById('hostPasswordMessage').textContent = '❌ Incorrect password.';
    }
  });

  // ------- USER HOME NAVIGATION -------
  document.getElementById('goLostBtn').addEventListener('click', () => { showPage(lostPage); loadLostItems(''); });
  document.getElementById('goFoundBtn').addEventListener('click', () => showPage(foundPage));
  document.getElementById('openCheckCodeBtn').addEventListener('click', () => {
    document.getElementById('checkCodeInput').value = '';
    document.getElementById('checkCodeResult').textContent = '';
    checkCodePopup.classList.remove('hidden');
  });
  document.getElementById('logoutFromHomeBtn').addEventListener('click', async () => { await auth.logOut(); showPage(loginPage); });

  // ------- LOST PAGE -------
  async function loadLostItems(searchTerm) {
    const container = document.getElementById('lostResults');
    container.innerHTML = '<p>⌛ Loading...</p>';
    try {
      const items = await searchLostItems(searchTerm);
      if(!items.length) { container.innerHTML = '<p>😔 No matching items.</p>'; return; }
      container.innerHTML = items.map(item => {
        const typeEmojis = { electronic:'📱', personal:'🎒', clothing:'👕', documents:'🪪', keys:'🔑', bags:'👜', other:'📌' };
        const typeEmoji = typeEmojis[item.get('type')] || '📌';
        const photo = item.get('photo');
        const desc = item.get('description') || '';
        const contact = item.get('contactInfo') || '';
        return `
          <div class="card">
            <div class="row"><strong>${typeEmoji} ${item.get('type')}</strong> <span>🕒 ${item.get('timeFound')?.toLocaleString?.()}</span></div>
            <div>🎨 ${item.get('color')} · 🏷️ ${item.get('model')}</div>
            <div>✨ ${item.get('appearance')}</div>
            ${desc ? `<div>📝 ${desc}</div>` : ''}
            <div>📍 ${item.get('locationFound')}</div>
            ${photo ? `<img src="${photo.url()}" class="item-photo">` : ''}
            <button class="verify-btn" data-id="${item.id}">🔐 Verify it's yours</button>
            <button class="small-btn forgot-btn" style="margin-top:4px;">❓ Forgot details?</button>
            <div class="contact-info hidden" id="contact-${item.id}">${contact ? '📞 '+contact : '⚠️ No contact provided.'}</div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.verify-btn').forEach(btn => btn.addEventListener('click', e => {
        currentVerifyingItemId = e.target.dataset.id;
        openVerifyPopup(currentVerifyingItemId);
      }));
      document.querySelectorAll('.forgot-btn').forEach(btn => btn.addEventListener('click', e => {
        const id = e.target.closest('.card').querySelector('.verify-btn').dataset.id;
        document.getElementById('contact-'+id).classList.toggle('hidden');
      }));
    } catch(e) { container.innerHTML = `<p style="color:red;">Error: ${e.message}</p>`; }
  }

  // ------- VERIFICATION POPUP -------
  async function openVerifyPopup(itemId) {
    document.getElementById('claimCodeSection').style.display = 'none';
    document.getElementById('verifyAnswerInput').style.display = '';
    document.getElementById('submitVerifyBtn').style.display = '';
    document.getElementById('cancelVerifyBtn').style.display = '';
    document.getElementById('verifyQuestionText').style.display = '';
    document.getElementById('verifyStatusMessage').style.display = '';
    document.getElementById('verifyMessage').textContent = '';
    document.getElementById('verifyStatusMessage').textContent = '';
    const answerInput = document.getElementById('verifyAnswerInput');
    answerInput.value = ''; answerInput.disabled = false;
    document.getElementById('submitVerifyBtn').disabled = false;

    try {
      const query = new Parse.Query(Parse.Object.extend("LostItem"));
      const item = await query.get(itemId);
      if (item.get("verificationBlocked")) {
        document.getElementById('verifyStatusMessage').textContent = '⛔ Permanently blocked.';
        answerInput.disabled = true;
        document.getElementById('submitVerifyBtn').disabled = true;
      } else {
        const nextAllowed = item.get("nextAttemptAllowedAt");
        if (nextAllowed && new Date() < new Date(nextAllowed)) {
          const diff = new Date(nextAllowed) - new Date();
          document.getElementById('verifyStatusMessage').textContent = `⏳ Cooldown: ${Math.floor(diff/3600000)}h ${Math.floor((diff%3600000)/60000)}m`;
          answerInput.disabled = true;
          document.getElementById('submitVerifyBtn').disabled = true;
        } else {
          const attempts = item.get("verificationAttempts") || 0;
          if (attempts >= 9) {
            document.getElementById('verifyStatusMessage').textContent = 'Blocked.';
            answerInput.disabled = true;
            document.getElementById('submitVerifyBtn').disabled = true;
          } else if (attempts >= 6) document.getElementById('verifyStatusMessage').textContent = `⚠️ ${attempts} wrong. 5h lock soon.`;
          else if (attempts >= 3) document.getElementById('verifyStatusMessage').textContent = `⚠️ ${attempts} wrong.`;
        }
      }
      const question = await getVerificationQuestion(itemId);
      document.getElementById('verifyQuestionText').textContent = '🔐 ' + (question || 'No question');
      verifyPopup.classList.remove('hidden');
    } catch(e) { alert('Error: '+e.message); }
  }

  document.getElementById('cancelVerifyBtn').addEventListener('click', () => verifyPopup.classList.add('hidden'));
  document.getElementById('submitVerifyBtn').addEventListener('click', async () => {
    if(!currentVerifyingItemId) return;
    const answer = document.getElementById('verifyAnswerInput').value.trim();
    if(!answer) return;
    try {
      const result = await verifyItem(currentVerifyingItemId, answer);
      if (result.success) {
        document.getElementById('claimCodeText').textContent = result.claimCode;
        document.getElementById('claimCodeSection').style.display = 'block';
        document.getElementById('verifyQuestionText').style.display = 'none';
        document.getElementById('verifyStatusMessage').style.display = 'none';
        document.getElementById('verifyAnswerInput').style.display = 'none';
        document.getElementById('submitVerifyBtn').style.display = 'none';
        document.getElementById('cancelVerifyBtn').style.display = 'none';
        document.getElementById('verifyMessage').textContent = '';
      } else {
        document.getElementById('verifyMessage').textContent = result.message;
        if (result.blocked) {
          document.getElementById('verifyAnswerInput').disabled = true;
          document.getElementById('submitVerifyBtn').disabled = true;
        } else if (result.cooldownEnd) {
          document.getElementById('verifyAnswerInput').disabled = true;
          document.getElementById('submitVerifyBtn').disabled = true;
        }
      }
    } catch(e) { document.getElementById('verifyMessage').textContent = e.message; }
  });

  // Copy claim code
  document.getElementById('copyClaimCodeBtn').addEventListener('click', () => {
    const code = document.getElementById('claimCodeText').textContent;
    navigator.clipboard.writeText(code).then(() => {
      alert('Claim code copied!');
    }).catch(() => alert('Could not copy.'));
  });

  document.getElementById('closeClaimCodeBtn').addEventListener('click', () => {
    verifyPopup.classList.add('hidden');
    loadLostItems(document.getElementById('lostSearchInput').value);
  });

  // ------- FOUND PAGE -------
  document.getElementById('foundType').addEventListener('change', e => {
    const q = document.getElementById('foundVeriQuestion');
    if(e.target.value === 'electronic') q.value = 'What is the wallpaper of this device?';
    else q.value = '';
  });
  document.getElementById('foundType').dispatchEvent(new Event('change'));

  document.getElementById('submitFoundBtn').addEventListener('click', async () => {
    const fields = ['foundColor','foundModel','foundTime','foundLocation','foundVeriQuestion','foundVeriAnswer'];
    if(fields.some(id => !document.getElementById(id).value.trim())) {
      alert('❌ Please fill all required fields.');
      return;
    }
    const data = {
      type: document.getElementById('foundType').value,
      color: document.getElementById('foundColor').value.trim(),
      model: document.getElementById('foundModel').value.trim(),
      appearance: document.getElementById('foundAppearance').value.trim(),
      description: document.getElementById('foundDescription').value.trim(),
      timeFound: new Date(document.getElementById('foundTime').value),
      locationFound: document.getElementById('foundLocation').value.trim(),
      verificationQuestion: document.getElementById('foundVeriQuestion').value.trim(),
      verificationAnswer: document.getElementById('foundVeriAnswer').value.trim(),
      contactInfo: document.getElementById('foundContactInfo').value.trim()
    };
    const photoInput = document.getElementById('foundPhoto');
    if(photoInput.files.length) {
      data.photoFile = photoInput.files[0];
      data.photoName = photoInput.files[0].name;
    }
    try {
      await createFoundItem(data);
      // Clear form
      ['foundColor','foundModel','foundAppearance','foundDescription','foundLocation','foundVeriAnswer','foundContactInfo','foundPhoto'].forEach(id => document.getElementById(id).value='');
      document.getElementById('foundType').dispatchEvent(new Event('change'));
      // Show success popup
      successPopup.classList.remove('hidden');
    } catch(e) {
      alert('Error: '+e.message);
    }
  });

  // Close success popup AND go back to Home
  document.getElementById('closeSuccessPopup').addEventListener('click', () => {
    successPopup.classList.add('hidden');
    showPage(homePage);
  });

  // Check claim code
  document.getElementById('cancelCheckCodeBtn').addEventListener('click', () => checkCodePopup.classList.add('hidden'));
  document.getElementById('submitCheckCodeBtn').addEventListener('click', async () => {
    const code = document.getElementById('checkCodeInput').value.trim();
    if(!code) return;
    document.getElementById('checkCodeResult').innerHTML = '⌛ Checking...';
    try {
      const res = await checkClaimCode(code);
      if(res.found) {
        document.getElementById('checkCodeResult').innerHTML = `
          ✅ Valid claim code!<br>
          Type: ${res.type}<br>
          🎨 ${res.color} · 🏷️ ${res.model}<br>
          📍 Found near: ${res.locationFound}
        `;
      } else {
        document.getElementById('checkCodeResult').innerHTML = '❌ Invalid code.';
      }
    } catch(e) { document.getElementById('checkCodeResult').innerHTML = 'Error: '+e.message; }
  });

  // Host admin panel
  async function loadAdminItems() {
    const container = document.getElementById('adminResults');
    container.innerHTML = '<p>⌛ Loading...</p>';
    try {
      const items = await adminGetAllItems();
      if(!items.length) { container.innerHTML = '<p>No items in database.</p>'; return; }
      container.innerHTML = items.map(item => `
        <div class="card admin-card">
          <div><strong>${item.get('type')}</strong> ${item.get('isResolved')?'✅':'❌'} ${item.get('verificationBlocked')?'⛔':''}</div>
          <div>🎨 ${item.get('color')} · 🏷️ ${item.get('model')}</div>
          <div>✨ ${item.get('appearance')}</div>
          <div>📝 ${item.get('description')||'-'}</div>
          <div>📍 ${item.get('locationFound')} · 🕒 ${item.get('timeFound')?.toLocaleString?.()}</div>
          <div>🔐 Q: ${item.get('verificationQuestion')||''}</div>
          <div>🔑 A: ${item.get('verificationAnswer')||''}</div>
          <div>📞 ${item.get('contactInfo')||'none'}</div>
          <div>🎫 Claim Code: ${item.get('claimCode')||'none'}</div>
          <div>🚫 Attempts: ${item.get('verificationAttempts')||0}</div>
          <div class="admin-actions">
            <button onclick="window.resetItem('${item.id}')">🔄 Reset</button>
            <button onclick="window.deleteItem('${item.id}')" style="background:#b91c1c;">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    } catch(e) { container.innerHTML = `<p style="color:red;">Error: ${e.message}</p>`; }
  }
  window.resetItem = async (id) => { if(confirm('Reset attempts?')) { await adminResetAttempts(id); loadAdminItems(); } };
  window.deleteItem = async (id) => { if(confirm('Delete permanently?')) { await adminDeleteItem(id); loadAdminItems(); } };

  checkSession();
</script>
</body>
</html>
