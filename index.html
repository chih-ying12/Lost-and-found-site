<script>
  Parse.initialize("qknjxJVl86XMkFayCADjD7S61rW8VajE0QVg9XDm", "uAZAVjQWw3VHdnqPGKdV3JEh8uivvEN8leNJi3bp");
  Parse.serverURL = "https://parseapi.back4app.com/";
  const LostItem = Parse.Object.extend("LostItem");
  const HOST_PASSWORD = "host123";
  const ALLOWED_EMAIL_DOMAIN = "@school.edu.sg";

  function generateClaimCode(len=6) {
    const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let code='';
    for(let i=0;i<len;i++) code+=chars[Math.floor(Math.random()*chars.length)];
    return code;
  }

  // ✅ CREATED FOUND ITEM – uses raw File, no Base64
  async function createFoundItem(data) {
    const item = new LostItem();
    item.set("type", data.type);
    item.set("color", data.color);
    item.set("model", data.model);
    item.set("appearance", data.appearance);
    item.set("description", data.description);
    item.set("timeFound", data.timeFound);
    item.set("locationBuilding", data.locationBuilding);
    item.set("locationFloor", data.locationFloor);
    item.set("locationRoom", data.locationRoom);
    item.set("verificationQuestion", data.verificationQuestion);
    item.set("verificationAnswer", data.verificationAnswer);
    item.set("isResolved", false);
    item.set("verificationAttempts", 0);
    item.set("nextAttemptAllowedAt", new Date());
    item.set("verificationBlocked", false);
    item.set("contactInfo", data.contactInfo);
    item.set("claimCode", "");
    if (data.photoFile) {
      const parseFile = new Parse.File(data.photoName, data.photoFile);
      item.set("photo", parseFile);
    }
    return item.save();
  }

  async function searchMatchingLostItems(criteria) {
    let query = new Parse.Query(LostItem);
    query.equalTo("isResolved", false);
    query.equalTo("verificationBlocked", false);
    if(criteria.type) query.equalTo("type", criteria.type);
    if(criteria.color) query.matches("color", new RegExp(criteria.color, "i"));
    if(criteria.model) query.matches("model", new RegExp(criteria.model, "i"));
    if(criteria.appearance) query.matches("appearance", new RegExp(criteria.appearance, "i"));
    if(criteria.description) query.matches("description", new RegExp(criteria.description, "i"));
    query.descending("createdAt");
    return query.find();
  }

  async function verifyItemOnly(itemId, userAnswer) {
    const query = new Parse.Query(LostItem);
    const item = await query.get(itemId);
    if(!item) return { success: false, message: "Not found." };
    if(item.get("isResolved")) return { success: false, message: "Already claimed." };
    if(item.get("verificationBlocked")) return { success: false, message: "Blocked.", blocked: true };
    const attempts = item.get("verificationAttempts")||0;
    const nextAllowed = item.get("nextAttemptAllowedAt");
    if(nextAllowed && new Date() < new Date(nextAllowed)) {
      const diff = new Date(nextAllowed)-new Date();
      return { success: false, message: `Cooldown: try in ${Math.floor(diff/3600000)}h ${Math.floor((diff%3600000)/60000)}m.` };
    }
    const correct = (item.get("verificationAnswer")||"").trim().toLowerCase();
    if(correct === userAnswer.trim().toLowerCase()) {
      return { success: true, correct: true };
    }
    const newAttempts = attempts+1;
    item.set("verificationAttempts", newAttempts);
    if(newAttempts>=9) {
      item.set("verificationBlocked",true); item.set("nextAttemptAllowedAt",null);
      await item.save();
      return { success: false, message: "Too many attempts. Blocked.", blocked: true };
    } else if(newAttempts>=6) {
      const cooldown = new Date(Date.now()+5*3600000);
      item.set("nextAttemptAllowedAt", cooldown); await item.save();
      return { success: false, message: "Wrong. Locked 5h.", cooldownEnd: cooldown };
    } else if(newAttempts>=3) {
      const cooldown = new Date(Date.now()+3*3600000);
      item.set("nextAttemptAllowedAt", cooldown); await item.save();
      return { success: false, message: "Wrong. Locked 3h.", cooldownEnd: cooldown };
    } else {
      item.set("nextAttemptAllowedAt", new Date()); await item.save();
      return { success: false, message: `Wrong. ${3-newAttempts} attempts left.` };
    }
  }

  // ✅ FINALIZE CLAIM – uses raw File for EZ‑Link photo
  async function finalizeClaim(itemId, ezlinkPhotoFile, appointmentDateTime) {
    const query = new Parse.Query(LostItem);
    const item = await query.get(itemId);
    if(!item) throw new Error("Item not found");
    if(item.get("isResolved")) throw new Error("Already claimed");
    const code = generateClaimCode();
    const parsePhoto = new Parse.File(ezlinkPhotoFile.name, ezlinkPhotoFile);
    item.set("ezlinkPhoto", parsePhoto);
    item.set("appointmentTime", new Date(appointmentDateTime));
    item.set("claimCode", code);
    item.set("isResolved", true);
    item.set("verificationAttempts", 0);
    item.set("nextAttemptAllowedAt", new Date());
    await item.save();
    return code;
  }

  async function getVerificationQuestion(itemId) {
    const q = new Parse.Query(LostItem);
    const item = await q.get(itemId);
    return item ? item.get("verificationQuestion") : null;
  }

  async function checkClaimCode(code) {
    const q = new Parse.Query(LostItem);
    q.equalTo("claimCode", code.trim().toUpperCase());
    q.equalTo("isResolved", true);
    const res = await q.find();
    if(res.length) {
      const i = res[0];
      return { found: true, type:i.get("type"), color:i.get("color"), model:i.get("model"),
               locationFound: `${i.get("locationBuilding")||''} ${i.get("locationFloor")||''} ${i.get("locationRoom")||''}`,
               appointment: i.get("appointmentTime") };
    }
    return { found: false };
  }

  async function adminGetAllItems() { const q = new Parse.Query(LostItem); q.descending("createdAt"); return q.find(); }
  async function adminResetAttempts(id) { const q = new Parse.Query(LostItem); const i=await q.get(id); i.set("verificationAttempts",0); i.set("nextAttemptAllowedAt", new Date()); i.set("verificationBlocked",false); return i.save(); }
  async function adminDeleteItem(id) { const q = new Parse.Query(LostItem); const i=await q.get(id); return i.destroy(); }

  // AUTH
  const auth = {
    signUp: async (username, email, ezlink, password) => {
      if(!email.toLowerCase().endsWith(ALLOWED_EMAIL_DOMAIN)) throw new Error(`Only ${ALLOWED_EMAIL_DOMAIN} emails allowed.`);
      if(!ezlink.trim()) throw new Error("Ezlink card number is required.");
      const user = new Parse.User();
      user.set("username", username);
      user.set("email", email);
      user.set("password", password);
      user.set("ezlink", ezlink);
      return user.signUp();
    },
    logIn: async (username, password) => Parse.User.logIn(username, password),
    logOut: async () => Parse.User.logOut(),
    getCurrentUser: () => Parse.User.current()
  };

  // UI references
  const loginPage = document.getElementById('loginPage');
  const rolePage = document.getElementById('roleSelectionPage');
  const homePage = document.getElementById('homePage');
  const lostPage = document.getElementById('lostPage');
  const foundPage = document.getElementById('foundPage');
  const adminPage = document.getElementById('adminPage');
  const hostPassPage = document.getElementById('hostPasswordPage');
  const verifyPopup = document.getElementById('verifyPopup');
  const ezlinkModal = document.getElementById('ezlinkAppointmentModal');
  const claimCodePopup = document.getElementById('claimCodePopup');
  const checkCodePopup = document.getElementById('checkCodePopup');
  const successPopup = document.getElementById('successPopup');
  const errorPopup = document.getElementById('errorPopup');

  let currentVerifyingItemId = null;

  function showPage(page) { document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden')); page.classList.remove('hidden'); }
  function setError(el, msg) { if(msg){ el.textContent=msg; el.classList.add('show'); } else { el.textContent=''; el.classList.remove('show'); } }

  function checkSession() {
    const u = auth.getCurrentUser();
    if(u) { document.getElementById('roleUsername').textContent = u.getUsername(); showPage(rolePage); }
    else showPage(loginPage);
  }

  // Login / Signup handlers
  document.getElementById('showSignUpCard').onclick = () => { document.getElementById('loginCard').classList.add('hidden'); document.getElementById('signUpCard').classList.remove('hidden'); setError(document.getElementById('loginError'),''); setError(document.getElementById('signUpError'),''); };
  document.getElementById('showLoginCard').onclick = () => { document.getElementById('signUpCard').classList.add('hidden'); document.getElementById('loginCard').classList.remove('hidden'); };
  document.getElementById('signInBtn').onclick = async () => {
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');
    if(!u||!p) { setError(err,'Enter username & password'); return; }
    try { await auth.logIn(u,p); setError(err,''); checkSession(); }
    catch(e) { setError(err, e.message.includes('Invalid')?'Wrong credentials':e.message); }
  };
  document.getElementById('signUpSubmitBtn').onclick = async () => {
    const u = document.getElementById('signUpUsername').value.trim();
    const e = document.getElementById('signUpEmail').value.trim();
    const ez = document.getElementById('signUpEzlink').value.trim();
    const p = document.getElementById('signUpPassword').value;
    const err = document.getElementById('signUpError');
    if(!u||!e||!ez||!p) { setError(err,'All fields required'); return; }
    try { await auth.signUp(u,e,ez,p); setError(err,''); checkSession(); }
    catch(e) { setError(err, e.message); }
  };
  document.getElementById('backToLoginFromRole').onclick = async () => { await auth.logOut(); showPage(loginPage); };
  document.getElementById('logoutFromRoleBtn').onclick = async () => { await auth.logOut(); showPage(loginPage); };
  document.getElementById('backToRoleFromHome').onclick = () => showPage(rolePage);
  document.getElementById('backToHomeFromLost').onclick = () => showPage(homePage);
  document.getElementById('backToHomeFromFound').onclick = () => showPage(homePage);
  document.getElementById('backToRoleFromHost').onclick = () => showPage(rolePage);
  document.getElementById('backToRoleFromAdmin').onclick = () => showPage(rolePage);
  document.getElementById('goUserBtn').onclick = () => { document.getElementById('displayUsername').innerText = auth.getCurrentUser().getUsername(); showPage(homePage); };
  document.getElementById('goHostAccessBtn').onclick = () => showPage(hostPassPage);
  document.getElementById('submitHostPasswordBtn').onclick = () => {
    if(document.getElementById('hostPasswordInput').value === HOST_PASSWORD) { loadAdminItems(); showPage(adminPage); }
    else document.getElementById('hostPasswordMessage').classList.add('show');
  };
  document.getElementById('goLostBtn').onclick = () => showPage(lostPage);
  document.getElementById('goFoundBtn').onclick = () => showPage(foundPage);
  document.getElementById('logoutFromHomeBtn').onclick = async () => { await auth.logOut(); showPage(loginPage); };

  // Matching lost items
  document.getElementById('searchMatchingBtn').onclick = async () => {
    const criteria = {
      type: document.getElementById('lostType').value,
      color: document.getElementById('lostColor').value,
      model: document.getElementById('lostModel').value,
      appearance: document.getElementById('lostAppearance').value,
      description: document.getElementById('lostDescription').value
    };
    const container = document.getElementById('lostResults');
    container.innerHTML = '<p>🔍 Searching...</p>';
    try {
      const items = await searchMatchingLostItems(criteria);
      if(!items.length) { container.innerHTML = '<p>😔 No matching found items. Try different details.</p>'; return; }
      container.innerHTML = items.map(item => {
        const photo = item.get('photo');
        const photoUrl = photo ? photo.url() : null;
        return `
          <div class="lost-item-card">
            <div><strong>${item.get('type')}</strong> · ${item.get('color')} · ${item.get('model')}</div>
            <div>📍 Found: ${item.get('locationBuilding')||''} ${item.get('locationFloor')||''} ${item.get('locationRoom')||''}</div>
            <div>✨ ${item.get('appearance')}</div>
            ${photoUrl ? `<img src="${photoUrl}" class="item-photo" alt="Item photo">` : ''}
            <button class="primary-btn verify-btn" data-id="${item.id}" style="margin-top:8px;">🔐 Claim this item</button>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.verify-btn').forEach(btn => btn.addEventListener('click', async (e) => {
        currentVerifyingItemId = e.target.dataset.id;
        const question = await getVerificationQuestion(currentVerifyingItemId);
        document.getElementById('verifyQuestionText').innerText = question || "No question set";
        const item = await new Parse.Query(LostItem).get(currentVerifyingItemId);
        const sugg = [item.get('color'), item.get('model'), item.get('appearance')].filter(v=>v);
        const optsDiv = document.getElementById('verifyOptionsPanel');
        optsDiv.innerHTML = sugg.map(s => `<button type="button" class="suggest-btn" data-val="${s}">${s}</button>`).join('');
        optsDiv.querySelectorAll('.suggest-btn').forEach(b => b.onclick = () => { document.getElementById('verifyAnswerInput').value = b.dataset.val; });
        verifyPopup.classList.remove('hidden');
      }));
    } catch(e) { container.innerHTML = `<p>Error: ${e.message}</p>`; }
  };

  // Verification popup
  document.getElementById('cancelVerifyBtn').onclick = () => verifyPopup.classList.add('hidden');
  document.getElementById('submitVerifyBtn').onclick = async () => {
    if(!currentVerifyingItemId) return;
    const ans = document.getElementById('verifyAnswerInput').value.trim();
    if(!ans) return;
    const result = await verifyItemOnly(currentVerifyingItemId, ans);
    if(result.success && result.correct) {
      verifyPopup.classList.add('hidden');
      document.getElementById('ezlinkPhotoInput').value = '';
      document.getElementById('appointmentTime').value = '';
      document.getElementById('finaliseMessage').innerText = '';
      ezlinkModal.classList.remove('hidden');
    } else {
      document.getElementById('verifyMessage').innerText = result.message;
      if(result.blocked || result.cooldownEnd) {
        document.getElementById('verifyAnswerInput').disabled = true;
        document.getElementById('submitVerifyBtn').disabled = true;
      }
    }
  };

  // Finalise claim – uses raw file
  document.getElementById('finaliseClaimBtn').onclick = async () => {
    const photoFile = document.getElementById('ezlinkPhotoInput').files[0];
    const appointment = document.getElementById('appointmentTime').value;
    if(!photoFile || !appointment) {
      document.getElementById('finaliseMessage').innerText = 'Please upload EZ-Link photo and select appointment time.';
      return;
    }
    try {
      const claimCode = await finalizeClaim(currentVerifyingItemId, photoFile, appointment);
      document.getElementById('finalClaimCode').innerText = claimCode;
      const formattedAppt = new Date(appointment).toLocaleString();
      document.getElementById('finalAppointment').innerText = formattedAppt;
      ezlinkModal.classList.add('hidden');
      claimCodePopup.classList.remove('hidden');
    } catch(e) {
      document.getElementById('finaliseMessage').innerText = e.message;
    }
  };
  document.getElementById('cancelFinaliseBtn').onclick = () => ezlinkModal.classList.add('hidden');
  document.getElementById('closeClaimCodePopupBtn').onclick = () => {
    claimCodePopup.classList.add('hidden');
    const searchBtn = document.getElementById('searchMatchingBtn');
    if(searchBtn) searchBtn.click();
  };

  // Check claim code
  document.getElementById('openCheckCodeBtn').onclick = () => checkCodePopup.classList.remove('hidden');
  document.getElementById('cancelCheckCodeBtn').onclick = () => checkCodePopup.classList.add('hidden');
  document.getElementById('submitCheckCodeBtn').onclick = async () => {
    const code = document.getElementById('checkCodeInput').value.trim();
    if(!code) return;
    const res = await checkClaimCode(code);
    const resultDiv = document.getElementById('checkCodeResult');
    if(res.found) {
      const appt = res.appointment ? new Date(res.appointment).toLocaleString() : 'Not scheduled';
      resultDiv.innerHTML = `<div style="background:#e6f7ec; padding:10px;">✅ Valid code! Item: ${res.type}, ${res.color}, ${res.model}<br>📍 ${res.locationFound}<br>📅 Appointment: ${appt}<br><strong>Bring your EZ-Link card to the General Office.</strong></div>`;
    } else {
      resultDiv.innerHTML = '❌ Invalid code.';
    }
  };

  // ✅ REPORT FOUND ITEM – uses raw File, no Base64
  document.getElementById('submitFoundBtn').onclick = async () => {
    const required = ['foundColor','foundModel','foundTime','foundBuilding','foundVeriQuestion','foundVeriAnswer'];
    if(required.some(id => !document.getElementById(id).value.trim())) {
      document.getElementById('errorPopupMessage').innerText = 'Please fill all required fields (*).';
      errorPopup.classList.remove('hidden');
      return;
    }
    const photoInput = document.getElementById('foundPhoto');
    let photoFile = null;
    let photoName = null;
    if (photoInput.files.length) {
      const file = photoInput.files[0];
      photoFile = file;
      photoName = file.name;
    }
    const data = {
      type: document.getElementById('foundType').value,
      color: document.getElementById('foundColor').value.trim(),
      model: document.getElementById('foundModel').value.trim(),
      appearance: document.getElementById('foundAppearance').value.trim(),
      description: document.getElementById('foundDescription').value.trim(),
      timeFound: new Date(document.getElementById('foundTime').value),
      locationBuilding: document.getElementById('foundBuilding').value.trim(),
      locationFloor: document.getElementById('foundFloor').value.trim(),
      locationRoom: document.getElementById('foundRoom').value.trim(),
      verificationQuestion: document.getElementById('foundVeriQuestion').value.trim(),
      verificationAnswer: document.getElementById('foundVeriAnswer').value.trim(),
      contactInfo: document.getElementById('foundContactInfo').value.trim(),
      photoFile: photoFile,
      photoName: photoName
    };
    try {
      await createFoundItem(data);
      successPopup.classList.remove('hidden');
      setTimeout(() => { successPopup.classList.add('hidden'); showPage(homePage); }, 1500);
    } catch(e) {
      document.getElementById('errorPopupMessage').innerText = e.message;
      errorPopup.classList.remove('hidden');
    }
  };

  document.getElementById('closeSuccessPopup').onclick = () => { successPopup.classList.add('hidden'); showPage(homePage); };
  document.getElementById('closeErrorPopup').onclick = () => errorPopup.classList.add('hidden');

  // ✅ ADMIN – displays photo as image
  async function loadAdminItems() {
    const container = document.getElementById('adminResults');
    container.innerHTML = 'Loading...';
    const items = await adminGetAllItems();
    if(!items.length) { container.innerHTML = '<p>No items</p>'; return; }
    container.innerHTML = items.map(item => {
      const photo = item.get('photo');
      const photoUrl = photo ? photo.url() : null;
      return `
        <div class="lost-item-card">
          <div><input type="checkbox" class="admin-checkbox" data-id="${item.id}" data-resolved="${item.get('isResolved')}"> <strong>${item.get('type')}</strong> ${item.get('isResolved')?'<span class="admin-badge badge-resolved">Resolved</span>':''}</div>
          <div>${item.get('color')} · ${item.get('model')}</div>
          <div>📍 ${item.get('locationBuilding')||''} ${item.get('locationFloor')||''} ${item.get('locationRoom')||''}</div>
          <div>🔐 Q: ${item.get('verificationQuestion')}</div>
          <div>Attempts: ${item.get('verificationAttempts')}</div>
          <div>📅 Appt: ${item.get('appointmentTime') ? new Date(item.get('appointmentTime')).toLocaleString() : 'N/A'}</div>
          ${photoUrl ? `<img src="${photoUrl}" class="item-photo" style="max-height:150px;" alt="Item photo">` : ''}
          <div><button onclick="window.resetAdminItem('${item.id}')" class="outline-btn">Reset</button> <button onclick="window.deleteAdminItem('${item.id}')" class="danger-btn">Delete</button></div>
        </div>
      `;
    }).join('');
    document.getElementById('selectAllBtn').onclick = () => { document.querySelectorAll('.admin-checkbox').forEach(c=>c.checked=true); };
    document.getElementById('selectResolvedBtn').onclick = () => { document.querySelectorAll('.admin-checkbox').forEach(c=>c.checked = c.dataset.resolved==='true'); };
    document.getElementById('deleteSelectedBtn').onclick = async () => {
      const ids = [...document.querySelectorAll('.admin-checkbox:checked')].map(c=>c.dataset.id);
      if(!ids.length) return alert('None selected');
      if(confirm(`Delete ${ids.length} items?`)) { await Promise.all(ids.map(id=>adminDeleteItem(id))); loadAdminItems(); }
    };
  }
  window.resetAdminItem = async (id) => { if(confirm('Reset attempts?')){ await adminResetAttempts(id); loadAdminItems(); } };
  window.deleteAdminItem = async (id) => { if(confirm('Delete?')){ await adminDeleteItem(id); loadAdminItems(); } };

  checkSession();
</script>
<script>
  Parse.initialize("qknjxJVl86XMkFayCADjD7S61rW8VajE0QVg9XDm", "uAZAVjQWw3VHdnqPGKdV3JEh8uivvEN8leNJi3bp");
  Parse.serverURL = "https://parseapi.back4app.com/";
  console.log("Parse initialized");

  // Just show the login page for testing
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('loginPage').classList.remove('hidden');
    document.querySelectorAll('.page').forEach(p => {
      if (p.id !== 'loginPage') p.classList.add('hidden');
    });
  });
</script>
